
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>

    <!-- Aurora Night Background -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1d1b"/>
      <stop offset="55%" stop-color="#081315"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>

    <!-- Aurora Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7CFFB2"/>
      <stop offset="40%" stop-color="#00E676"/>
      <stop offset="75%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>

      <animate
        attributeName="x1"
        values="-100%;100%;-100%"
        dur="10s"
        repeatCount="indefinite"/>

      <animate
        attributeName="x2"
        values="0%;200%;0%"
        dur="10s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle
        cx="2"
        cy="2"
        r="1"
        fill="#5ca88a"
        fill-opacity="0.12"/>
    </pattern>

    <!-- Aurora Blur -->
    <filter id="aurora-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

  </defs>

  <style>
    .greeting{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      font-size:13px;
      font-weight:600;
      fill:#9fd6be;
      letter-spacing:5px;
    }

    .name{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      font-size:52px;
      font-weight:800;
      fill:white;
      letter-spacing:-1.5px;
    }

    .role{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      font-size:18px;
      font-weight:600;
      fill:url(#primary-grad);
      letter-spacing:3px;
      text-transform:uppercase;
    }

    .fade-in{
      opacity:0;
      animation:fadeIn 1.4s ease forwards;
    }

    .delay-1{animation-delay:.2s;}
    .delay-2{animation-delay:.4s;}
    .delay-3{animation-delay:.6s;}

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>

  <!-- Background -->
  <rect
      width="800"
      height="300"
      fill="url(#bg-glow)"
      rx="12"/>

  <!-- Aurora -->
  <g
    filter="url(#aurora-blur)"
    opacity="0.38"
    transform="translate(0,-60)">

    <!-- Green -->
    <path fill="#39FF88" opacity="0.70">
      <animate
        attributeName="d"
        dur="10s"
        repeatCount="indefinite"
        values="
M-150,220
C60,100 240,270 430,150
C620,60 760,170 950,90
L950,-80 L-150,-80 Z;

M-150,170
C150,20 330,250 520,100
C700,40 850,210 950,120
L950,-80 L-150,-80 Z;

M-150,220
C60,100 240,270 430,150
C620,60 760,170 950,90
L950,-80 L-150,-80 Z"/>
    </path>

    <!-- Emerald -->
    <path fill="#00E676" opacity="0.55">
      <animate
        attributeName="d"
        dur="12s"
        repeatCount="indefinite"
        values="
M-150,260
C120,180 320,300 520,180
C700,110 840,230 950,150
L950,-80 L-150,-80 Z;

M-150,210
C200,100 380,320 590,110
C760,50 860,240 950,90
L950,-80 L-150,-80 Z;

M-150,260
C120,180 320,300 520,180
C700,110 840,230 950,150
L950,-80 L-150,-80 Z"/>
    </path>

    <!-- Cyan -->
    <path fill="#00E5FF" opacity="0.32">
      <animate
        attributeName="d"
        dur="14s"
        repeatCount="indefinite"
        values="
M-150,120
C120,30 340,180 560,50
C720,-20 850,90 950,20
L950,-80 L-150,-80 Z;

M-150,80
C180,-20 420,150 610,20
C790,-40 900,120 950,40
L950,-80 L-150,-80 Z;

M-150,120
C120,30 340,180 560,50
C720,-20 850,90 950,20
L950,-80 L-150,-80 Z"/>
    </path>

    <!-- Blue Accent -->
    <path fill="#4FC3F7" opacity="0.18">
      <animate
        attributeName="d"
        dur="16s"
        repeatCount="indefinite"
        values="
M-150,170
C90,70 310,220 470,120
C660,20 820,150 950,80
L950,-80 L-150,-80 Z;

M-150,140
C160,10 350,200 560,70
C730,0 860,160 950,120
L950,-80 L-150,-80 Z;

M-150,170
C90,70 310,220 470,120
C660,20 820,150 950,80
L950,-80 L-150,-80 Z"/>
    </path>

  </g>

  <!-- Grid -->
  <rect
      width="800"
      height="300"
      fill="url(#dot-grid)"
      rx="12"/>

  <!-- Corner -->
  <path
      d="M30 80 L30 30 L80 30"
      fill="none"
      stroke="#17352d"
      stroke-width="1"/>

  <path
      d="M30 80 L30 30 L80 30"
      fill="none"
      stroke="url(#primary-grad)"
      stroke-width="2"
      stroke-dasharray="100"
      stroke-dashoffset="100">

      <animate
          attributeName="stroke-dashoffset"
          values="100;-100"
          dur="4s"
          repeatCount="indefinite"/>
  </path>

  <!-- Corner -->
  <path
      d="M770 220 L770 270 L720 270"
      fill="none"
      stroke="#17352d"
      stroke-width="1"/>

  <path
      d="M770 220 L770 270 L720 270"
      fill="none"
      stroke="url(#primary-grad)"
      stroke-width="2"
      stroke-dasharray="100"
      stroke-dashoffset="100">

      <animate
          attributeName="stroke-dashoffset"
          values="100;-100"
          dur="4s"
          repeatCount="indefinite"/>
  </path>

  <!-- Text -->
  <g text-anchor="middle">

    <text
        x="400"
        y="115"
        class="greeting fade-in delay-1">
      HELLO WORLD
    </text>

    <text
        x="400"
        y="170"
        class="name fade-in delay-2">
      Luthfi Adilal Mahbub
    </text>

    <text
        x="400"
        y="215"
        class="role fade-in delay-3">
      Fullstack Developer
    </text>

  </g>

  <!-- Bottom Line -->
  <line
      x1="400"
      y1="245"
      x2="400"
      y2="245"
      stroke="#00E676"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.65">

      <animate
          attributeName="x1"
          values="400;360;400"
          dur="5s"
          repeatCount="indefinite"/>

      <animate
          attributeName="x2"
          values="400;440;400"
          dur="5s"
          repeatCount="indefinite"/>

  </line>

</svg>

