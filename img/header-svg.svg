<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <!-- Sleek Dark Background -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Modern Gradient for Role Text & Accents -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
      <animate attributeName="x1" values="-100%;100%;-100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%;0%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Subtle Dot Pattern for Tech Vibe -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.3" />
    </pattern>

    <!-- Blur Filter for Ambient Orbs -->
    <filter id="ambient-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
  </defs>

  <style>
    /* Typography settings */
    .greeting {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #64748b;
      letter-spacing: 5px;
    }
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 52px;
      font-weight: 800;
      fill: #f8fafc;
      letter-spacing: -1.5px;
    }
    .role {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      font-weight: 500;
      fill: url(#primary-grad);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    
    /* CSS Animations */
    .fade-in {
      opacity: 0;
      animation: fadeIn 1.5s ease-out forwards;
    }
    .delay-1 { animation-delay: 0.2s; }
    .delay-2 { animation-delay: 0.4s; }
    .delay-3 { animation-delay: 0.6s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- 1. Background Layer -->
  <rect width="800" height="300" fill="url(#bg-glow)" rx="12" />
  
  <!-- 2. Ambient Glowing Orbs (Moving Slowly) -->
  <circle cx="200" cy="150" r="120" fill="#38bdf8" opacity="0.15" filter="url(#ambient-blur)">
    <animate attributeName="cx" values="150;350;150" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;200;100" dur="15s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="150" r="120" fill="#c084fc" opacity="0.15" filter="url(#ambient-blur)">
    <animate attributeName="cx" values="650;450;650" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="200;100;200" dur="13s" repeatCount="indefinite" />
  </circle>

  <!-- 3. Tech Grid Overlay -->
  <rect width="800" height="300" fill="url(#dot-grid)" rx="12" />

  <!-- 4. Minimalist Animated Corners -->
  <!-- Top Left Corner Tracing -->
  <path d="M 30 80 L 30 30 L 80 30" fill="none" stroke="#334155" stroke-width="1" />
  <path d="M 30 80 L 30 30 L 80 30" fill="none" stroke="url(#primary-grad)" stroke-width="2" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;-100" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Bottom Right Corner Tracing -->
  <path d="M 770 220 L 770 270 L 720 270" fill="none" stroke="#334155" stroke-width="1" />
  <path d="M 770 220 L 770 270 L 720 270" fill="none" stroke="url(#primary-grad)" stroke-width="2" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;-100" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- 5. Main Typography -->
  <g text-anchor="middle">
    <!-- Greeting -->
    <text x="400" y="115" class="greeting fade-in delay-1">HELLO WORLD</text>
    
    <!-- Name -->
    <text x="400" y="170" class="name fade-in delay-2">Luthfi Adilal Mahbub</text>
    
    <!-- Role -->
    <text x="400" y="215" class="role fade-in delay-3">Fullstack Developer</text>
  </g>

  <!-- 6. Center Minimalist Expanding Line -->
  <line x1="400" y1="245" x2="400" y2="245" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <animate attributeName="x1" values="400;360;400" dur="5s" repeatCount="indefinite" ease="ease-in-out" />
    <animate attributeName="x2" values="400;440;400" dur="5s" repeatCount="indefinite" ease="ease-in-out" />
  </line>
</svg>
